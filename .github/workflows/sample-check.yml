# Runs the README's step 1 (without `npm run notebook`) and checks that the
# workspace validates.
name: Sample check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sample-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Sample check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install ZLens
        run: |
          npm install
          npm install --prefix .dql/connectors duckdb

      - name: Open the database with ZLens's DuckDB driver
        # Fails if jaffle_shop.duckdb was written by a DuckDB that ZLens
        # cannot read (for example DuckDB 2.0).
        run: |
          node -e "
            const { Database } = require('./.dql/connectors/node_modules/duckdb');
            new Database('jaffle_shop.duckdb', { access_mode: 'READ_ONLY' }, (err) => {
              if (err) { console.error(err.message); process.exit(1); }
              console.log('jaffle_shop.duckdb opens with the ZLens DuckDB driver');
            });
          "

      - name: Sync
        run: npm run sync

      - name: Validate
        run: npm run validate
